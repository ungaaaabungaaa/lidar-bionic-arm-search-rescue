<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc"><title id="title">LiDAR arm bench: twelve measured model runs</title><desc id="desc">Open scenes have direct routes, raised fixtures need a lift, keep-out and beyond-reach scenes emit no motion. Bars show model reference seconds only, not elapsed compute time.</desc><rect width="1000" height="690" fill="#f6f5ef"/><g font-family="monospace" fill="#253d32"><text x="30" y="38" font-size="24">REACH / Measured pregrasp references</text><text x="30" y="67" font-size="13">4 scenes × 3 seeds · fixed 25000-pose budget · dt 0.05 s · no hardware</text><text x="30" y="105" font-size="13">SCENE / SEED</text><text x="260" y="105" font-size="13">REFERENCE DURATION (s)</text><text x="640" y="105" font-size="13">OUTCOME / POSE CHECKS</text><text x="30" y="137" font-size="13">open / 1</text><rect x="260" y="124" width="156" height="18" fill="#365344"/><text x="426" y="137" font-size="12">3.00</text><text x="640" y="137" font-size="12">planned / 178</text><text x="30" y="178" font-size="13">open / 2</text><rect x="260" y="165" width="156" height="18" fill="#365344"/><text x="426" y="178" font-size="12">3.00</text><text x="640" y="178" font-size="12">planned / 178</text><text x="30" y="219" font-size="13">open / 3</text><rect x="260" y="206" width="156" height="18" fill="#365344"/><text x="426" y="219" font-size="12">3.00</text><text x="640" y="219" font-size="12">planned / 178</text><text x="30" y="260" font-size="13">detour / 1</text><rect x="260" y="247" width="275.59999999999997" height="18" fill="#b54c20"/><text x="545.5999999999999" y="260" font-size="12">5.30</text><text x="640" y="260" font-size="12">planned / 414</text><text x="30" y="301" font-size="13">detour / 2</text><rect x="260" y="288" width="275.59999999999997" height="18" fill="#b54c20"/><text x="545.5999999999999" y="301" font-size="12">5.30</text><text x="640" y="301" font-size="12">planned / 414</text><text x="30" y="342" font-size="13">detour / 3</text><rect x="260" y="329" width="275.59999999999997" height="18" fill="#b54c20"/><text x="545.5999999999999" y="342" font-size="12">5.30</text><text x="640" y="342" font-size="12">planned / 414</text><text x="30" y="383" font-size="13">forbidden / 1</text><text x="260" y="383" font-size="12">No motion reference</text><text x="640" y="383" font-size="12">goal_in_collision / 2</text><text x="30" y="424" font-size="13">forbidden / 2</text><text x="260" y="424" font-size="12">No motion reference</text><text x="640" y="424" font-size="12">goal_in_collision / 2</text><text x="30" y="465" font-size="13">forbidden / 3</text><text x="260" y="465" font-size="12">No motion reference</text><text x="640" y="465" font-size="12">goal_in_collision / 2</text><text x="30" y="506" font-size="13">far / 1</text><text x="260" y="506" font-size="12">No motion reference</text><text x="640" y="506" font-size="12">unreachable / 0</text><text x="30" y="547" font-size="13">far / 2</text><text x="260" y="547" font-size="12">No motion reference</text><text x="640" y="547" font-size="12">unreachable / 0</text><text x="30" y="588" font-size="13">far / 3</text><text x="260" y="588" font-size="12">No motion reference</text><text x="640" y="588" font-size="12">unreachable / 0</text><text x="30" y="661" font-size="12">Kinematic simulation only. Failure is reported; planner limits do not prove no route exists.</text></g></svg>
